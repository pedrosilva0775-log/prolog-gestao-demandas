name: PROLOG CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: prolog-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prolog_test
          POSTGRES_USER: prolog_test
          POSTGRES_PASSWORD: prolog_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prolog_test -d prolog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prolog_test:prolog_test_password@localhost:5432/prolog_test
      DB_SSL: 'false'
      SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      MFA_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_URL: http://localhost:3000
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run test:coverage
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm audit --omit=dev --audit-level=moderate
  image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve immutable image reference
        id: image-ref
        shell: bash
        run: echo "value=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
  homologation:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    environment: homologation
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: test -n "$DEPLOY_WEBHOOK_URL" && test -n "$DEPLOY_TOKEN" && test -n "$HEALTHCHECK_URL"
      - name: Deploy immutable image to homologation
        id: deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg image "$IMAGE_REF" --arg environment homologation '{action:"deploy",image:$image,environment:$environment,runId:env.GITHUB_RUN_ID}')")
          deployment_id=$(jq -er '.deploymentId' <<<"$response")
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Wait for homologation readiness
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          for _ in {1..30}; do
            curl --fail --silent --show-error --max-time 5 "$HEALTHCHECK_URL/ready" && exit 0
            sleep 10
          done
          exit 1
      - name: Roll back failed homologation
        if: failure() && steps.deploy.outputs.deployment_id != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$DEPLOYMENT_ID" '{action:"rollback",deploymentId:$id}')"
  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, homologation]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: test -n "$DEPLOY_WEBHOOK_URL" && test -n "$DEPLOY_TOKEN" && test -n "$HEALTHCHECK_URL"
      - name: Deploy immutable image to production
        id: deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg image "$IMAGE_REF" --arg environment production '{action:"deploy",image:$image,environment:$environment,runId:env.GITHUB_RUN_ID}')")
          deployment_id=$(jq -er '.deploymentId' <<<"$response")
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Wait for production readiness
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          for _ in {1..30}; do
            curl --fail --silent --show-error --max-time 5 "$HEALTHCHECK_URL/ready" && exit 0
            sleep 10
          done
          exit 1
      - name: Roll back failed production deployment
        if: failure() && steps.deploy.outputs.deployment_id != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$DEPLOYMENT_ID" '{action:"rollback",deploymentId:$id}')"
