services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - prolog_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolog -d prolog"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  prolog_postgres:
