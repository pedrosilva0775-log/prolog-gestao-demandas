services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prolog_test
      POSTGRES_USER: prolog_test
      POSTGRES_PASSWORD: prolog_test_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolog_test -d prolog_test"]
      interval: 2s
      timeout: 3s
      retries: 15
